<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Operators</title>
</head>

<body>
    <h2 style="text-align: center;">Check Your Browsers Console</h2>

    <script>
        // Arithmetic Operators
        let num_1 = 100;
        let num_2 = 5;

        console.log("Addition : " + (num_1 + num_2));
        console.log("Subtraction : " + (num_1 - num_2));
        console.log("Mulitply: " + (num_1 * num_2));
        console.log("Exponentiation : " + (num_1 ** num_2));
        console.log("Divison : " + (num_1 / num_2));
        console.log("Modulus : " + (num_1 % num_2));
        console.log("Increment : " + (++num_1));
        console.log("Decrement : " + (--num_1));

        //Assignment Opertors
        let num = 100

        console.log("= : " + num);
        console.log("+= : " + (num += num_2));
        console.log("-= : " + (num -= num_2));
        console.log("*= : " + (num *= num_2));
        console.log("/= : " + (num /= num_2));
        console.log("%= : " + (num %= num_2));
        console.log("**= : " + (num += num_2));

        //Comparsion Opertors
        let x = 100;
        let y = 200;

        console.log("== : " + (x == y));
        console.log("=== : " + (x === y));
        console.log("!= : " + (x != y));
        console.log("!== : " + (x !== y));
        console.log("> : " + (x > y));
        console.log("< : " + (x < y));
        console.log(">= : " + (x >= y));
        console.log("<= : " + (x <= y));

        // Logical Operators
        console.log("AND &&")
        console.log(true && true);
        console.log(true && false);
        console.log(false && false);

        console.log("OR ||")
        console.log(true || true);
        console.log(true || false);
        console.log(false || false);

        console.log("NOT !")
        console.log(! true);
        console.log(! false);


    </script>
</body>

</html>
